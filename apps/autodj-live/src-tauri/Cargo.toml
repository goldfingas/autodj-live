[package]
name = "autodj-live-app"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
name = "autodj_live_app"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "autodj-live"
path = "src/main.rs"

[dependencies]
autodj-live-supervisor = { path = "../../../crates/live-supervisor" }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.12.4", features = [] }
tokio = { version = "1.48.0", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1.18.1", features = ["serde"] }

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dev-dependencies]
serde_json = "1.0"
