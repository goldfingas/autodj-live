[package]
name = "autodj-live-supervisor"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
autobins = false

[dependencies]
autodj-live-protocol = { path = "../live-protocol" }
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48.0", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }

[[bin]]
name = "supervisor-fixture"
path = "tests/fixtures/child.rs"
test = false
bench = false
