[package]
name = "autodj-live-engine"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
live-audio = { path = "../live-audio" }
autodj-live-protocol = { path = "../live-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
tokio = { version = "1.48.0", features = ["io-util", "net", "rt", "sync", "time", "macros"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.8"
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["process"] }
