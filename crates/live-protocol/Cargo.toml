[package]
name = "autodj-live-protocol"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
rmp-serde = "1.3.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.48.0", features = ["io-util"] }
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "rt"] }
